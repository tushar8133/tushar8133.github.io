<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tushar's Gitworks</title>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			background: #f4f5f7;
			min-height: 100vh;
			padding: 28px 16px;
			color: #222;
		}

		.container {
			max-width: 1250px;
			margin: 0 auto;
		}

		/* HEADER */

		.header {
			text-align: center;
			margin-bottom: 42px;
		}

		.header h1 {
			font-size: 3.1em;
			font-weight: 800;
			margin-bottom: 10px;
			letter-spacing: -1px;
		}

		.header p {
			font-size: 1.08em;
			color: #666;
		}

		/* GRID */

		.cards-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
			gap: 22px;
		}

		/* CARD BASE */

		.card {
			background: white;
			border-radius: 18px;
			overflow: hidden;
			border: 1px solid #e6e6e6;
			transition: all 0.28s ease;
			position: relative;
		}

		.card:hover {
			transform: translateY(-5px);
			box-shadow: 0 14px 30px rgba(0, 0, 0, 0.08);
		}

		/* MULTI CARD */

		.multi-card {
			background: linear-gradient(135deg, #ab47bc, #7b1fa2);
			padding: 0;
		}

		.card-header {
			padding: 18px 18px 14px;
			font-size: 1.35em;
			font-weight: 700;
			color: white;
			text-align: center;
			border-bottom: 1px solid rgba(255, 255, 255, 0.2);
			letter-spacing: 0.3px;
		}

		.card-content {
			padding: 16px;
		}

		.multi-card .card-links {
			list-style: none;
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.multi-card .card-links a {
			display: flex;
			align-items: center;
			justify-content: center;
			text-align: center;
			text-decoration: none;
			color: white;
			background: rgba(255, 255, 255, 0.2);
			padding: 12px 14px;
			border-radius: 10px;
			font-weight: 600;
			transition: all 0.2s ease;
			border: 1px solid rgba(255, 255, 255, 0.3);
		}

		.multi-card .card-links a:hover {
			background: rgba(255, 255, 255, 0.3);
			border-color: rgba(255, 255, 255, 0.5);
			transform: scale(1.02);
		}

		/* SINGLE CARD */

		.single-card {
			background: linear-gradient(135deg, #667eea, #764ba2);
			padding: 0;
			display: flex;
		}

		.single-card a {
			display: flex;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 24px;
			text-decoration: none;
			color: white;
			font-size: 2em;
			font-weight: 700;
			transition: all 0.25s ease;
			letter-spacing: -0.3px;
			width: 100%;
			flex: 1;
			min-height: 160px;
		}

		.single-card a:hover {
			background: rgba(0, 0, 0, 0.15);
			letter-spacing: 0.3px;
		}

		/* PRIVATE */

		.private-card {
			border-style: dashed;
			border-color: #cfcfcf;
		}

		/* MOBILE */

		@media (max-width: 768px) {
			body {
				padding: 20px 14px;
			}

			.header h1 {
				font-size: 2.2em;
			}

			.cards-grid {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>

<body>

	<div class="container">

		<div class="header">
			<h1>Tushar's Gitworks</h1>
			<p>A collection of resources and repositories</p>
		</div>

		<div class="cards-grid">

</body>
</html>
