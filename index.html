<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tushar's Gitworks</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			background: #f5f5f5;
			min-height: 100vh;
			padding: 25px 15px;
		}
		
		.container {
			max-width: 1200px;
			margin: 0 auto;
		}
		
		.header {
			text-align: center;
			color: #333;
			margin-bottom: 35px;
		}
		
		.header h1 {
			font-size: 3em;
			margin-bottom: 8px;
		}
		
		.header p {
			font-size: 1.1em;
			color: #666;
		}
		
		.cards-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
			gap: 20px;
			margin-bottom: 20px;
		}
		
		.card {
			background: white;
			border-radius: 12px;
			overflow: hidden;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
			transition: all 0.3s ease;
			border: 1px solid #e0e0e0;
		}
		
		.card:hover {
			transform: translateY(-4px);
			box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
		}
		
		.card-header {
			background: #f9f9f9;
			color: #333;
			padding: 15px 18px;
			font-size: 1.5em;
			font-weight: 600;
			border-bottom: 1px solid #e0e0e0;
		}
		
		.card-content {
			padding: 15px 18px;
		}
		
		.card-links {
			list-style: none;
		}
		
		.card-links li {
			margin-bottom: 8px;
		}
		
		.card-links li:last-child {
			margin-bottom: 0;
		}
		
		.card-links a {
			display: inline-block;
			color: #555;
			text-decoration: none;
			padding: 6px 10px;
			border-radius: 6px;
			transition: all 0.2s ease;
			font-weight: 500;
			width: 100%;
			border-left: 3px solid transparent;
			padding-left: 10px;
		}
		
		.card-links a:hover {
			background-color: #f0f0f0;
			border-left-color: #999;
			padding-left: 15px;
			color: #333;
		}
		
		.private-card .card-header {
			background: #fafafa;
		}
		
		@media (max-width: 768px) {
			.header h1 {
				font-size: 2em;
			}
			
			.cards-grid {
				grid-template-columns: 1fr;
				gap: 20px;
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="header">
			<h1>Tushar's Gitworks</h1>
			<p>A collection of resources and repositories</p>
		</div>
		
		<div class="cards-grid">
			<!-- Windows Card -->
			<div class="card">
				<div class="card-header">Windows</div>
				<div class="card-content">
					<ul class="card-links">
						<li><a href="https://github.com/tushar8133/windows">General</a></li>
						<li><a href="https://github.com/tushar8133/windows/blob/master/shell-guid.md">Shell</a></li>
						<li><a href="https://github.com/tushar8133/windows/blob/master/batch.md">Batch</a></li>
						<li><a href="https://ss64.com/nt/shell.html">SS64 Run Commands</a></li>
					</ul>
				</div>
			</div>
			
			<!-- Linux Card -->
			<div class="card">
				<div class="card-header">Linux</div>
				<div class="card-content">
					<ul class="card-links">
						<li><a href="https://github.com/tushar8133/main-linux/blob/main/readme.md">General</a></li>
						<li><a href="https://github.com/tushar8133/main-linux/blob/main/distro.md">Distro</a></li>
						<li><a href="https://github.com/tushar8133/main-linux/blob/main/archlinux.md">Arch Linux</a></li>
					</ul>
				</div>
			</div>
			
			<!-- MacOS Card -->
			<div class="card">
				<div class="card-header">MacOS</div>
				<div class="card-content">
					<ul class="card-links">
						<li><a href="https://github.com/tushar8133/main-macos/blob/main/readme.md">Info</a></li>
					</ul>
				</div>
			</div>
			
			<!-- Architecture Card -->
			<div class="card">
				<div class="card-header">Architecture</div>
				<div class="card-content">
					<ul class="card-links">
						<li><a href="https://github.com/tushar8133/main-architecture/tree/main">Info</a></li>
					</ul>
				</div>
			</div>
			
			<!-- Android Card -->
			<div class="card">
				<div class="card-header">Android</div>
				<div class="card-content">
					<ul class="card-links">
						<li><a href="https://github.com/tushar8133/main-android/blob/main/readme.md">General</a></li>
						<li><a href="https://github.com/tushar8133/main-android/blob/main/samsung-m21/readme.md">SM-M21F</a></li>
					</ul>
				</div>
			</div>
			
			<!-- Arduino Card -->
			<div class="card">
				<div class="card-header">Arduino</div>
				<div class="card-content">
					<ul class="card-links">
						<li><a href="https://github.com/tushar8133/windows/blob/master/arduino.md">Info</a></li>
					</ul>
				</div>
			</div>
			
			<!-- MFA Card -->
			<div class="card">
				<div class="card-header">MFA</div>
				<div class="card-content">
					<ul class="card-links">
						<li><a href="https://tusharkumar.info/mfa">MFA</a></li>
					</ul>
				</div>
			</div>
			
			<!-- Private Card -->
			<div class="card private-card">
				<div class="card-header">(Private)</div>
				<div class="card-content">
					<ul class="card-links">
						<li><a href="https://github.com/tushar8133/learn">My Learnings</a></li>
					</ul>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
